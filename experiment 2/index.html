<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LeafLog - JavaScript ES6 Programs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-leaf">
    <div class="container">
      <span class="navbar-brand fw-bold">🌿 LeafLog</span>
      <span class="text-white-50 small">Experiment 2: JavaScript ES6</span>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row g-4">

      <!-- Buttons column -->
      <div class="col-12 col-lg-5">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title mb-3">Programs</h5>
            <div class="d-grid gap-2">
              <button id="btnDate" class="btn btn-leaf">1. Display Current Date</button>
              <button id="btnFact" class="btn btn-leaf">2. Factorial of a Number</button>
              <button id="btnTable" class="btn btn-leaf">3. Multiplication Table</button>
              <button id="btnSum" class="btn btn-leaf">4. Sum of N Numbers</button>
              <hr>
              <button id="btnArray" class="btn btn-outline-success">5. Arrays: map, filter, reduce</button>
              <button id="btnPlant" class="btn btn-outline-success">6. LeafLog: Next Watering Date</button>
              <button id="btnClear" class="btn btn-outline-secondary">Clear Output</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Output column -->
      <div class="col-12 col-lg-7">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-white fw-semibold">Output</div>
          <div class="card-body">
            <pre id="output" class="output-box mb-0">Click a button to run a program...</pre>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
